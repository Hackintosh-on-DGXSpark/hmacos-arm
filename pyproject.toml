[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmacos-arm"
version = "0.1.0"
description = "Research tooling for an arm64 macOS guest on NVIDIA DGX Spark"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Icegrave0391"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts", "sysroot", "third_party", "patches"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
